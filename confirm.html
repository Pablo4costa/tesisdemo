<!doctype html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confirmar transacción - Housegur</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container center">
<section class="card narrow">
<h2 id="titulo">Confirmar compra</h2>
<div id="resumen"></div>
<div id="resultado" class="muted"></div>


<div class="actions">
<button id="btnConfirm" class="btn primary">Confirmar</button>
<a class="btn" id="btnCancelar">Cancelar</a>
</div>
</section>
<footer class="muted small">Transacción a través de la API de Housegur.</footer>
</main>


<script src="js/app.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
// Get parameters from URL
const action = getParam('action') || 'buy'; // buy or sell
const property_id = getParam('property_id');
// property_title / price_per_token llegan desde el listado; desde el chat solo llega el id
// y se completan con la API en loadProperty()
let property_title = getParam('property_title') || '';
let price_per_token = getParam('price_per_token') || 0;
const cantidad_param = Number(getParam('cantidad'));
const cantidad_inicial = Number.isInteger(cantidad_param) && cantidad_param > 0 ? cantidad_param : 10;

// Get user info from localStorage
const usuario_id = localStorage.getItem('usuario_id');
const nombre = localStorage.getItem('nombre');

console.log('[CONFIRM] Page loaded:', { action, property_id, usuario_id });

// Check if user is logged in
if (!usuario_id) {
  document.getElementById('resumen').innerHTML = '<p>⚠️ <strong>No estás identificado.</strong></p>';
  document.getElementById('resultado').textContent = 'Por favor inicia sesión primero.';
  document.getElementById('btnConfirm').disabled = true;
}

// Update title based on action
const titulo = document.getElementById('titulo');
if (action === 'sell') {
  titulo.textContent = 'Confirmar venta de tokens';
}

// Set cancel button behavior
document.getElementById('btnCancelar').addEventListener('click', () => {
  console.log('[CONFIRM] Cancel clicked, redirecting to propiedades');
  window.location.href = 'propiedades.html';
});

// Show summary
let cantidadInput = null;
let totalEUR = null;

function renderResumen() {
  document.getElementById('resumen').innerHTML = `
<p>Acción: <strong>${action === 'buy' ? 'Comprar tokens' : 'Vender tokens'}</strong></p>
<p>Usuario: <strong>${escapeHtml(nombre || 'Invitado')}</strong></p>
<p>Propiedad: <strong>${escapeHtml(property_title || 'Propiedad')}</strong></p>
<p>Precio por token: <strong>${price_per_token} EUR</strong></p>
<div style="margin-top: 12px;">
  <label class="field">
    <span>Cantidad de tokens:</span>
    <input id="cantidadTokens" type="number" placeholder="Ej. 10" min="1" value="${cantidad_inicial}" />
  </label>
</div>
<div id="totalCalc" style="margin-top: 12px; padding: 12px; background: #f5f5f5; border-radius: 6px;">
  <p>Total: <strong id="totalEUR">0 EUR</strong></p>
</div>
`;
  cantidadInput = document.getElementById('cantidadTokens');
  totalEUR = document.getElementById('totalEUR');
  cantidadInput.addEventListener('input', updateTotal);
  updateTotal(); // Initial calculation
}

function updateTotal() {
  const cantidad = Number(cantidadInput.value) || 0;
  const total = cantidad * Number(price_per_token);
  totalEUR.textContent = total.toLocaleString() + ' EUR';
}

function mostrarErrorPropiedad(mensaje) {
  document.getElementById('resumen').innerHTML =
    `<p>❌ <strong>${escapeHtml(mensaje)}</strong></p><p><a class="btn" href="propiedades.html">Ver propiedades</a></p>`;
  document.getElementById('btnConfirm').disabled = true;
}

// Load the property from the API so the page works even when only the ID is in the URL
// (e.g. when the chat assistant navigates here)
async function loadProperty() {
  const idNum = Number(property_id);
  if (!property_id || !Number.isInteger(idNum) || idNum <= 0) {
    mostrarErrorPropiedad('No se indicó una propiedad válida.');
    return;
  }

  renderResumen();
  try {
    const props = await getProperties();
    const prop = (props || []).find(p => Number(p.id) === idNum);
    if (!prop) {
      mostrarErrorPropiedad(`La propiedad ${idNum} no existe.`);
      return;
    }
    property_title = prop.titulo || property_title;
    price_per_token = Number(prop.precio_token ?? prop.precio ?? price_per_token);
    const cantidadActual = cantidadInput.value;
    renderResumen();
    cantidadInput.value = cantidadActual;
    updateTotal();
  } catch (err) {
    console.error('[CONFIRM] Failed to load property:', err);
    // Si el listado ya pasó título y precio por URL, se sigue con esos datos
    if (!property_title || !Number(price_per_token)) {
      mostrarErrorPropiedad('No se pudieron cargar los datos de la propiedad.');
    }
  }
}

loadProperty();

// Handle confirm button
document.getElementById('btnConfirm').addEventListener('click', async () => {
  if (!usuario_id) {
    document.getElementById('resultado').textContent = '❌ No estás identificado';
    return;
  }

  if (!property_id) {
    document.getElementById('resultado').textContent = '❌ Propiedad no especificada';
    return;
  }

  const tokens = Number(cantidadInput.value);
  if (!tokens || tokens <= 0) {
    document.getElementById('resultado').textContent = '⚠️ Ingresa una cantidad válida de tokens';
    return;
  }

  document.getElementById('btnConfirm').disabled = true;
  document.getElementById('resultado').textContent = '⏳ Procesando transacción...';

  try {
    let response;
    
    if (action === 'buy') {
      console.log('[CONFIRM] Calling buyTokens:', { usuario_id, property_id, tokens, price_per_token });
      response = await buyTokens(usuario_id, property_id, tokens, Number(price_per_token));
    } else if (action === 'sell') {
      console.log('[CONFIRM] Calling sellTokens:', { usuario_id, property_id, tokens, price_per_token });
      response = await sellTokens(usuario_id, property_id, tokens, Number(price_per_token));
    }

    console.log('[CONFIRM] Transaction response:', response);
    
    // Show success message
    document.getElementById('resultado').innerHTML = 
      `✅ <strong>Transacción completada exitosamente!</strong><br>
       Serás redirigido a tu portafolio en 3 segundos...`;
    document.getElementById('resultado').style.color = '#28a745';

    // Redirect to mis-tokens after 3 seconds
    setTimeout(() => {
      window.location.href = 'mis-tokens.html';
    }, 3000);

  } catch (error) {
    console.error('[CONFIRM] Transaction failed:', error);
    document.getElementById('resultado').innerHTML = 
      `❌ <strong>Error en la transacción</strong><br>
       ${escapeHtml(error.message || 'Intenta de nuevo más tarde.')}`;
    document.getElementById('resultado').style.color = '#dc3545';
    document.getElementById('btnConfirm').disabled = false;
  }
});
</script>
</body>
</html>
